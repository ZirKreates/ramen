<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ramen House</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo" data-aos="flip-down" data-aos-duration="1200" data-aos-delay="100">Ramen House | 魂のラーメン</div>
        <nav id="nav">
            <ul>
                <li><a href="#" data-aos="fade-up" data-aos-duration="1200">Home</a></li>
                <li><a href="#" data-aos="fade-up" data-aos-duration="1200" data-aos-delay="100">Specials</a></li>
                <li><a href="#" data-aos="fade-up" data-aos-duration="1200" data-aos-delay="200">Reviews</a></li>
                <li><a href="#" data-aos="fade-up" data-aos-duration="1200" data-aos-delay="300">Contact Us</a></li>
            </ul>
            <div class="social">
                <a href="#" target="_blank"><span><i class="fab fa-instagram"></i></span></a>
                <a href="#" target="_blank"><span><i class="fab fa-facebook"></i></span></a>
                <a href="#" target="_blank"><span><i class="fab fa-tiktok"></i></span></a>
                <a href="#" target="_blank"><span><i class="fas fa-map-marker-alt"></i></span></a>
            </div>

        </nav>
        <div class="hamburger" id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </div>

    </header>
    <section class="container">
        <div class="intro">
            <p data-aos="fade-right" data-aos-duration="1200" data-aos-delay="400">Why Wait for</p>
            <h1 data-aos="zoom-out" data-aos-duration="1500" data-aos-delay="600">Japan?</h1>
            <h2 data-aos="zoom-in-right" data-aos-duration="1500" data-aos-delay="700">Ramen</h2>
            <p data-aos="flip-down" data-aos-duration="1500" data-aos-delay="900">Awaits.</p>
            <button class="order-btn" data-aos="flip-down" data-aos-duration="1200" data-aos-delay="400">Order
                Now</button>
        </div>
        <div class="ramen-pic">
            <img src="./main.png" data-aos="slide-left" data-aos-duration="3000" alt="Ramen House">
        </div>
    </section>

    <script>
        // Mobile Menu Toggle
        const hamburger = document.getElementById('hamburger');
        const nav = document.getElementById('nav');
        hamburger.addEventListener('click', () => {
            nav.classList.toggle('active');
            hamburger.innerHTML = nav.classList.contains('active') ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-bars"></i>';
        });
    </script>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>

</body>

</html>
